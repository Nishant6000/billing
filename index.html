<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>Ginsoft POS</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" defer></script>
  </head>
  <body>
    <div id="splash-screen" class="splash-screen">
      <div class="splash-card">
        <div class="splash-logo"><i class="fa-solid fa-cash-register"></i></div>
        <h1>Ginsoft POS</h1>
        <p>by Ginsoft Private Limited</p>
      </div>
    </div>
    <jeep-sqlite></jeep-sqlite>
    <div id="app-shell" class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <div class="brand-mark"><i class="fa-solid fa-cash-register"></i></div>
          <div class="brand-text">
            <strong>Ginsoft POS</strong>
            <span>Retail Suite</span>
          </div>
          <button class="sidebar-collapse-btn" id="sidebar-collapse" aria-label="Collapse sidebar" title="Collapse sidebar">
            <i class="fa-solid fa-angles-left"></i>
          </button>
        </div>
        <nav class="nav-menu" id="nav-menu"></nav>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <button class="icon-btn d-lg-none" id="sidebar-toggle" aria-label="Toggle menu">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div>
            <p class="eyebrow mb-0" id="shop-name-label">Ginsoft POS Store</p>
            <h1 id="page-title" class="page-title">Dashboard</h1>
          </div>
          <div class="topbar-actions">
            <span class="status-pill" id="db-status"><i class="fa-solid fa-circle-notch fa-spin"></i> Starting DB</span>
            <button class="btn btn-refresh" id="page-refresh" type="button" title="Refresh current page">
              <i class="fa-solid fa-rotate"></i><span>Refresh</span>
            </button>
            <button class="btn btn-primary-gradient" data-action="new-bill"><i class="fa-solid fa-plus"></i> New Bill</button>
          </div>
        </header>

        <section id="view" class="content-view"></section>
      </main>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-container"></div>
    <div class="modal fade" id="app-modal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content" id="app-modal-content"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
